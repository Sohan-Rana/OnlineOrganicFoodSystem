<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Online Organic Food System – Demo</title>
<style>
:root{--bg:#f3f7f0;--card:#fff;--ink:#16261b;--muted:#5d6e62;--line:#d9e3d6;--green:#1f7a45;--green-soft:#dff0e2;--warn:#b26a00;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1b14;--card:#16251c;--ink:#e6f0e8;--muted:#9db2a3;--line:#29392f;--green:#5fc58a;--green-soft:#1d3a29;--warn:#f0c26a;--bad:#ff9b92}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.logo{font-weight:800;font-size:1.1rem;margin-right:auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:9px;font-weight:600}
.btn.p{background:var(--green);border-color:var(--green);color:#fff}
.btn.s{padding:4px 10px;font-size:.85rem}
.btn.d{color:var(--bad);border-color:var(--bad)}
.tabs{display:flex;gap:4px;flex:1 1 100%;overflow-x:auto}
.tab{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--green-soft);color:var(--green)}
main{max-width:1100px;margin:auto;padding:20px 16px 60px}
h1{font-size:1.9rem;margin:0 0 4px;line-height:1.2}
.muted{color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
.tools input{flex:1 1 220px;width:auto}
.chip{border:1px solid var(--line);background:var(--card);padding:5px 12px;border-radius:99px}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font-size:1rem}
.bn{color:var(--muted);font-weight:400;font-size:.85em}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.price{font-weight:800;font-size:1.1rem}
.low{color:var(--warn);font-size:.8rem;font-weight:600}
.out{color:var(--bad);font-size:.8rem;font-weight:600}
.step{display:inline-flex;align-items:center;border:1px solid var(--green);border-radius:9px;overflow:hidden}
.step button{border:0;background:var(--green-soft);color:var(--green);width:30px;height:30px;font-weight:700}
.step span{min-width:36px;text-align:center;font-weight:600}
.layer{position:fixed;inset:0;z-index:20;display:flex;background:rgba(0,0,0,.5)}
.layer[hidden]{display:none}
.panel{margin-left:auto;width:min(400px,100%);height:100%;background:var(--card);display:flex;flex-direction:column}
.dlg{margin:auto;width:min(480px,calc(100% - 24px));max-height:90vh;overflow:auto;background:var(--card);border-radius:16px}
.ph{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:1.15rem}
.pb{padding:14px 16px;display:grid;gap:10px;align-content:start;overflow:auto;flex:1}
.line{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px}
.sum{display:grid;gap:4px;padding:14px 16px;border-top:1px solid var(--line)}
.sum div{display:flex;justify-content:space-between}
.tot{font-weight:800;font-size:1.15rem}
.field{display:grid;gap:4px}
.field label{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase}
.err{color:var(--bad);min-height:1.3em;font-size:.88rem}
.order{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;margin-bottom:12px}
.pill{background:var(--green-soft);color:var(--green);border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:700}
.pill.bad{color:var(--bad)}
.flow{display:flex;gap:4px}
.flow i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.flow i.on{background:var(--green)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:.9rem}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;color:var(--muted)}
.scroll{overflow-x:auto}
td select{width:auto;padding:4px 6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:1.6rem}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30}
.toast[hidden]{display:none}
.empty{text-align:center;padding:40px 10px;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
</style>
</head>
<body>
<header><div class="bar" id="bar"></div></header>
<main id="main"></main>
<div class="layer" id="drawer" hidden></div>
<div class="layer" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
const KEY = 'organic-demo-v2';
const CATS = ['Vegetables', 'Fruits', 'Grains & pulses', 'Dairy & eggs', 'Honey & oils'];
const FLOW = ['Pending', 'Confirmed', 'Packed', 'Out for delivery', 'Delivered'];
const ALL_STATUS = [...FLOW, 'Cancelled'];

const SEED_PRODUCTS = [
  ['Tomato','টমেটো','Vegetables',90,'kg',60,'Jashore'],['Spinach','পালং শাক','Vegetables',60,'kg',35,'Gazipur'],
  ['Pumpkin','মিষ্টি কুমড়া','Vegetables',55,'kg',80,'Bogura'],['Green chilli','কাঁচা মরিচ','Vegetables',160,'kg',8,'Bogura'],
  ['Banana','কলা','Fruits',120,'dozen',40,'Narsingdi'],['Guava','পেয়ারা','Fruits',130,'kg',28,'Barishal'],
  ['Lemon','লেবু','Fruits',220,'kg',0,'Sylhet'],['Chinigura rice','চিনিগুঁড়া চাল','Grains & pulses',150,'kg',200,'Dinajpur'],
  ['Red lentil','মসুর ডাল','Grains & pulses',140,'kg',90,'Pabna'],['Free-range eggs','দেশি ডিম','Dairy & eggs',180,'dozen',24,'Savar'],
  ['Fresh cow milk','গরুর দুধ','Dairy & eggs',110,'litre',30,'Sirajganj'],['Ghee','ঘি','Dairy & eggs',1100,'kg',12,'Sirajganj'],
  ['Mustard oil','সরিষার তেল','Honey & oils',380,'litre',40,'Manikganj'],['Sundarbans honey','সুন্দরবনের মধু','Honey & oils',1200,'kg',8,'Khulna'],
  ['Date molasses','খেজুরের গুড়','Honey & oils',320,'kg',25,'Jashore']
].map((r, i) => ({ id: 'p' + (i + 1), name: r[0], bn: r[1], cat: r[2], price: r[3], unit: r[4], stock: r[5], origin: r[6] }));

function freshState() {
  return {
    users: [
      { id: 'u1', name: 'Admin', email: 'admin@organicfood.demo', pass: 'admin123', role: 'admin' },
      { id: 'u2', name: 'Nusrat Jahan', email: 'customer@organicfood.demo', pass: 'customer123', role: 'customer' }
    ],
    products: SEED_PRODUCTS, orders: [], cart: [], session: null, next: 1
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (!S || !S.products) S = freshState();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

let view = 'shop', adminTab = 'overview', cat = 'All', query = '', afterLogin = null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => '৳' + Math.round(n).toLocaleString('en-US');
const qf = (q) => Number.isInteger(q) ? String(q) : q.toFixed(1);
const me = () => S.users.find(u => u.id === S.session) || null;
const isAdmin = () => me()?.role === 'admin';
const prod = (id) => S.products.find(p => p.id === id);
const step = (p) => (p.unit === 'kg' || p.unit === 'litre') ? 0.5 : 1;
const cartQty = (id) => S.cart.find(c => c.id === id)?.qty || 0;
const sub = () => S.cart.reduce((a, c) => a + (prod(c.id)?.price || 0) * c.qty, 0);
const fee = (s) => (s <= 0 || s >= 1000) ? 0 : 60;
const dateFmt = (iso) => new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2400); }

/* ---------- header ---------- */
function renderBar() {
  const u = me();
  const tabs = [['shop', 'Shop'], ['orders', 'My orders'], ...(isAdmin() ? [['admin', 'Admin']] : [])];
  $('#bar').innerHTML = `<span class="logo">🥦 Online Organic Food</span>
    ${u ? `<span class="muted">Hi, ${esc(u.name.split(' ')[0])}</span><button class="btn s" data-a="logout">Log out</button>` : `<button class="btn s" data-a="login">Log in</button>`}
    <button class="btn p" data-a="cart">Cart (${S.cart.length})</button>
    <nav class="tabs">${tabs.map(t => `<button class="tab ${view === t[0] ? 'on' : ''}" data-a="nav" data-v="${t[0]}">${t[1]}</button>`).join('')}</nav>`;
}

/* ---------- shop ---------- */
function renderShop() {
  $('#main').innerHTML = `<h1>Organic food from small farms</h1>
    <p class="muted">Delivery ৳60, free over ৳1,000. Pay cash or bKash on delivery.</p>
    <div class="tools"><input id="q" type="search" placeholder="Search tomato, মধু, Jashore…" value="${esc(query)}">
    ${['All', ...CATS].map(c => `<button class="chip ${cat === c ? 'on' : ''}" data-a="cat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <div class="grid" id="grid"></div>`;
  renderGrid();
}
function renderGrid() {
  const q = query.trim().toLowerCase();
  const list = S.products.filter(p => (cat === 'All' || p.cat === cat) && (!q || `${p.name} ${p.bn} ${p.origin} ${p.cat}`.toLowerCase().includes(q)));
  $('#grid').innerHTML = list.length ? list.map(p => {
    const n = cartQty(p.id), out = p.stock <= 0, low = !out && p.stock <= 10;
    const ctl = out ? '<button class="btn s" disabled>Sold out</button>'
      : n ? `<div class="step"><button data-a="dec" data-id="${p.id}">−</button><span>${qf(n)}</span><button data-a="inc" data-id="${p.id}">+</button></div>`
      : `<button class="btn p s" data-a="inc" data-id="${p.id}">Add</button>`;
    return `<div class="card"><h3>${esc(p.name)} <span class="bn">${esc(p.bn)}</span></h3>
      <div class="muted">${esc(p.cat)} · ${esc(p.origin)}</div>
      ${out ? '<div class="out">Out of stock</div>' : low ? `<div class="low">Only ${qf(p.stock)} ${esc(p.unit)} left</div>` : ''}
      <div class="row"><span class="price">${money(p.price)}<span class="muted" style="font-weight:400;font-size:.8rem"> / ${esc(p.unit)}</span></span>${ctl}</div></div>`;
  }).join('') : '<div class="empty" style="grid-column:1/-1">Nothing matches your search.</div>';
}

/* ---------- cart ---------- */
function setQty(id, q) {
  const p = prod(id); if (!p) return;
  if (q > p.stock) { q = p.stock; toast(`Only ${qf(p.stock)} ${p.unit} in stock`); }
  S.cart = S.cart.filter(c => c.id !== id);
  if (q > 0) S.cart.push({ id, qty: q });
  save(); renderBar(); if (view === 'shop') renderGrid(); if (!$('#drawer').hidden) renderCart();
}
function renderCart() {
  const d = $('#drawer'), s = sub(), f = fee(s);
  const lines = S.cart.map(c => ({ c, p: prod(c.id) })).filter(x => x.p);
  d.innerHTML = `<div class="panel" role="dialog" aria-label="Cart"><div class="ph"><h2>Your cart</h2><button class="btn s" data-a="closeCart">Close</button></div>
    <div class="pb">${lines.length ? lines.map(({ c, p }) => `<div class="line"><div><b>${esc(p.name)}</b><br><span class="muted">${money(p.price * c.qty)}</span></div>
      <div class="step"><button data-a="dec" data-id="${p.id}">−</button><span>${qf(c.qty)} ${esc(p.unit)}</span><button data-a="inc" data-id="${p.id}">+</button></div></div>`).join('')
      : '<div class="empty">Your cart is empty.</div>'}</div>
    ${lines.length ? `<div class="sum"><div><span>Subtotal</span><span>${money(s)}</span></div><div><span>Delivery</span><span>${f ? money(f) : 'Free'}</span></div>
      <div class="tot"><span>Total</span><span>${money(s + f)}</span></div><button class="btn p" data-a="checkout">Checkout</button></div>` : ''}</div>`;
}
const openCart = () => { $('#drawer').hidden = false; renderCart(); };
const closeCart = () => { $('#drawer').hidden = true; };

/* ---------- modal helpers ---------- */
function openModal(html) { const m = $('#modal'); m.innerHTML = `<div class="dlg">${html}</div>`; m.hidden = false; m.querySelector('input,textarea')?.focus(); }
const closeModal = () => { $('#modal').hidden = true; $('#modal').innerHTML = ''; };
const field = (id, label, type = 'text', val = '') => `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(val)}"></div>`;

/* ---------- auth ---------- */
function openAuth(mode = 'login', msg = '') {
  const reg = mode === 'register';
  openModal(`<div class="ph"><h2>${reg ? 'Create account' : 'Log in'}</h2><button class="btn s" data-a="closeModal">Close</button></div>
    <form class="pb" data-f="auth" data-mode="${mode}">${msg ? `<div class="muted">${esc(msg)}</div>` : ''}
    ${reg ? field('a-name', 'Full name') : ''}${field('a-email', 'Email', 'email')}${field('a-pass', 'Password', 'password')}
    <div class="err" id="a-err"></div><button class="btn p">${reg ? 'Create account' : 'Log in'}</button>
    <button type="button" class="btn s" data-a="authMode" data-v="${reg ? 'login' : 'register'}">${reg ? 'I already have an account' : 'Create a new account'}</button>
    <div class="muted" style="font-size:.8rem">Demo: customer@organicfood.demo / customer123 · admin@organicfood.demo / admin123</div></form>`);
}
function authSubmit(form) {
  const reg = form.dataset.mode === 'register', err = $('#a-err');
  const email = $('#a-email').value.trim().toLowerCase(), pass = $('#a-pass').value;
  if (!/^\S+@\S+\.\S+$/.test(email)) return err.textContent = 'Enter a valid email.';
  let u;
  if (reg) {
    const name = $('#a-name').value.trim();
    if (name.length < 2) return err.textContent = 'Enter your name.';
    if (pass.length < 6) return err.textContent = 'Password needs 6+ characters.';
    if (S.users.some(x => x.email === email)) return err.textContent = 'That email is already registered.';
    u = { id: 'u' + Date.now(), name, email, pass, role: 'customer' }; S.users.push(u);
  } else {
    u = S.users.find(x => x.email === email && x.pass === pass);
    if (!u) return err.textContent = 'Email or password is incorrect.';
  }
  S.session = u.id; save(); closeModal(); renderAll(); toast(`Welcome, ${u.name.split(' ')[0]}`);
  const f = afterLogin; afterLogin = null; if (f) f();
}

/* ---------- checkout ---------- */
function openCheckout() {
  const u = me(), s = sub(), f = fee(s);
  openModal(`<div class="ph"><h2>Checkout</h2><button class="btn s" data-a="closeModal">Close</button></div>
    <form class="pb" data-f="checkout">${field('c-name', 'Name', 'text', u.name)}${field('c-phone', 'Mobile', 'tel', u.phone || '')}
    <div class="field"><label for="c-addr">Delivery address</label><textarea id="c-addr" rows="3">${esc(u.address || '')}</textarea></div>
    <div class="field"><label for="c-pay">Payment</label><select id="c-pay"><option>Cash on delivery</option><option>bKash on delivery</option></select></div>
    <div class="tot">Total: ${money(s + f)} <span class="muted" style="font-weight:400">(delivery ${f ? money(f) : 'free'})</span></div>
    <div class="err" id="c-err"></div><button class="btn p">Place order</button></form>`);
}
function checkoutSubmit() {
  const u = me(), err = $('#c-err');
  const name = $('#c-name').value.trim(), phone = $('#c-phone').value.replace(/[\s-]/g, ''), addr = $('#c-addr').value.trim();
  if (name.length < 2) return err.textContent = 'Enter your name.';
  if (!/^01[3-9]\d{8}$/.test(phone)) return err.textContent = 'Enter a mobile number like 01712345678.';
  if (addr.length < 8) return err.textContent = 'Enter a full address.';
  const items = [];
  for (const c of S.cart) {
    const p = prod(c.id);
    if (!p || p.stock < c.qty) return err.textContent = `${p ? p.name : 'An item'} is no longer available in that quantity.`;
    items.push({ id: p.id, name: p.name, unit: p.unit, price: p.price, qty: c.qty });
  }
  if (!items.length) return err.textContent = 'Your cart is empty.';
  items.forEach(i => prod(i.id).stock -= i.qty);
  const s = sub(), f = fee(s);
  const o = { id: 'OF-' + String(S.next++).padStart(4, '0'), userId: u.id, created: new Date().toISOString(), status: 'Pending', items, total: s + f, fee: f, pay: $('#c-pay').value, name, phone, address: addr };
  S.orders.push(o); Object.assign(u, { phone, address: addr }); S.cart = []; save();
  closeModal(); view = 'orders'; renderAll(); toast(`Order ${o.id} placed`);
}

/* ---------- orders ---------- */
function setStatus(o, st) {
  if (o.status === st) return;
  const sign = st === 'Cancelled' ? 1 : o.status === 'Cancelled' ? -1 : 0;
  if (sign) o.items.forEach(i => { const p = prod(i.id); if (p) p.stock = Math.max(0, p.stock + sign * i.qty); });
  o.status = st; save();
}
function renderOrders() {
  const u = me();
  if (!u) { $('#main').innerHTML = '<div class="empty">Log in to see your orders.<br><br><button class="btn p" data-a="login">Log in</button></div>'; return; }
  const list = S.orders.filter(o => o.userId === u.id).reverse();
  $('#main').innerHTML = '<h1>My orders</h1><br>' + (list.length ? list.map(o => {
    const idx = FLOW.indexOf(o.status);
    return `<div class="order"><div class="line" style="border:0;padding:0"><b>${esc(o.id)}</b><span class="muted">${dateFmt(o.created)}</span>
      <span class="pill ${o.status === 'Cancelled' ? 'bad' : ''}">${esc(o.status)}</span></div>
      ${o.status === 'Cancelled' ? '' : `<div class="flow">${FLOW.map((s, k) => `<i class="${k <= idx ? 'on' : ''}" title="${s}"></i>`).join('')}</div>`}
      ${o.items.map(i => `<div class="line" style="border:0;padding:0"><span>${esc(i.name)} × ${qf(i.qty)} ${esc(i.unit)}</span><span>${money(i.price * i.qty)}</span></div>`).join('')}
      <div class="line" style="border:0;padding:0"><b>Total</b><b>${money(o.total)}</b></div>
      <div class="muted">${esc(o.pay)} · ${esc(o.address)}</div>
      ${o.status === 'Pending' ? `<div><button class="btn s d" data-a="cancel" data-id="${o.id}">Cancel order</button></div>` : ''}</div>`;
  }).join('') : '<div class="empty">No orders yet.</div>');
}

/* ---------- admin ---------- */
function renderAdmin() {
  if (!isAdmin()) { view = 'shop'; return renderAll(); }
  const tabs = [['overview', 'Overview'], ['products', 'Products'], ['orders', 'Orders']];
  let h = `<h1>Admin</h1><div class="tools">${tabs.map(t => `<button class="chip ${adminTab === t[0] ? 'on' : ''}" data-a="atab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>`;
  if (adminTab === 'overview') {
    const live = S.orders.filter(o => o.status !== 'Cancelled');
    const low = S.products.filter(p => p.stock <= 10);
    h += `<div class="stats"><div class="stat">Orders<b>${S.orders.length}</b></div><div class="stat">Pending<b>${S.orders.filter(o => o.status === 'Pending').length}</b></div>
      <div class="stat">Order value<b>${money(live.reduce((a, o) => a + o.total, 0))}</b></div><div class="stat">Products<b>${S.products.length}</b></div></div>
      <h3>Low or out of stock</h3>${low.length ? low.map(p => `<div class="line"><span>${esc(p.name)}</span><span class="${p.stock <= 0 ? 'out' : 'low'}">${p.stock <= 0 ? 'Out' : qf(p.stock) + ' ' + esc(p.unit)}</span></div>`).join('') : '<div class="muted">All products are well stocked.</div>'}`;
  } else if (adminTab === 'products') {
    h += `<div class="tools"><button class="btn p" data-a="pnew">Add product</button></div><div class="scroll"><table><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr>
      ${S.products.map(p => `<tr><td>${esc(p.name)} <span class="bn">${esc(p.bn)}</span></td><td>${esc(p.cat)}</td><td>${money(p.price)}/${esc(p.unit)}</td><td>${qf(p.stock)}</td>
      <td><button class="btn s" data-a="pedit" data-id="${p.id}">Edit</button> <button class="btn s d" data-a="pdel" data-id="${p.id}">Delete</button></td></tr>`).join('')}</table></div>`;
  } else {
    h += `<div class="scroll"><table><tr><th>Order</th><th>Customer</th><th>Date</th><th>Total</th><th>Payment</th><th>Status</th></tr>
      ${[...S.orders].reverse().map(o => `<tr><td>${esc(o.id)}</td><td>${esc(o.name)}</td><td>${dateFmt(o.created)}</td><td>${money(o.total)}</td><td>${esc(o.pay)}</td>
      <td><select data-c="status" data-id="${o.id}">${ALL_STATUS.map(s => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table></div>
      ${S.orders.length ? '' : '<div class="empty">No orders yet.</div>'}`;
  }
  $('#main').innerHTML = h;
}
function openProduct(id) {
  const p = id ? prod(id) : { name: '', bn: '', cat: CATS[0], price: '', unit: 'kg', stock: '', origin: '' };
  openModal(`<div class="ph"><h2>${id ? 'Edit' : 'Add'} product</h2><button class="btn s" data-a="closeModal">Close</button></div>
    <form class="pb" data-f="product" data-id="${id || ''}">${field('p-name', 'Name', 'text', p.name)}${field('p-bn', 'Name in Bangla', 'text', p.bn)}
    <div class="field"><label for="p-cat">Category</label><select id="p-cat">${CATS.map(c => `<option ${c === p.cat ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
    <div class="field"><label for="p-unit">Unit</label><select id="p-unit">${['kg', 'litre', 'dozen', 'piece'].map(c => `<option ${c === p.unit ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
    ${field('p-price', 'Price (৳)', 'number', p.price)}${field('p-stock', 'Stock', 'number', p.stock)}${field('p-origin', 'Farm district', 'text', p.origin)}
    <div class="err" id="p-err"></div><button class="btn p">Save</button></form>`);
}
function productSubmit(form) {
  const d = { name: $('#p-name').value.trim(), bn: $('#p-bn').value.trim(), cat: $('#p-cat').value, unit: $('#p-unit').value,
    price: parseFloat($('#p-price').value), stock: parseFloat($('#p-stock').value), origin: $('#p-origin').value.trim() };
  const err = $('#p-err');
  if (d.name.length < 2) return err.textContent = 'Enter a name.';
  if (!(d.price > 0)) return err.textContent = 'Price must be above 0.';
  if (!(d.stock >= 0)) return err.textContent = 'Enter the stock.';
  const id = form.dataset.id;
  if (id) Object.assign(prod(id), d); else S.products.push({ id: 'p' + Date.now(), ...d });
  save(); closeModal(); renderAll(); toast('Product saved');
}

/* ---------- render + events ---------- */
function renderAll() {
  renderBar();
  ({ shop: renderShop, orders: renderOrders, admin: renderAdmin })[view]();
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const a = t.dataset.a, id = t.dataset.id, v = t.dataset.v;
  const actions = {
    nav() {
      if (v === 'orders' && !me()) { afterLogin = () => { view = 'orders'; renderAll(); }; return openAuth('login', 'Log in to see your orders.'); }
      view = v; closeCart(); closeModal(); renderAll();
    },
    cat() { cat = v; renderShop(); },
    inc() { const p = prod(id); setQty(id, cartQty(id) + step(p)); },
    dec() { const p = prod(id); setQty(id, cartQty(id) - step(p)); },
    cart: openCart, closeCart, closeModal,
    login() { openAuth('login'); },
    authMode() { openAuth(v); },
    logout() { S.session = null; save(); view = 'shop'; renderAll(); toast('Logged out'); },
    checkout() {
      if (!me()) { afterLogin = openCart; closeCart(); return openAuth('login', 'Log in to place your order. Your cart is saved.'); }
      closeCart(); openCheckout();
    },
    cancel() { const o = S.orders.find(x => x.id === id); if (o?.status === 'Pending') { setStatus(o, 'Cancelled'); renderOrders(); toast('Order cancelled'); } },
    atab() { adminTab = v; renderAdmin(); },
    pnew() { openProduct(''); },
    pedit() { openProduct(id); },
    pdel() { if (confirm('Delete this product?')) { S.products = S.products.filter(p => p.id !== id); S.cart = S.cart.filter(c => c.id !== id); save(); renderAll(); } }
  };
  actions[a]?.();
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('form[data-f]'); if (!f) return;
  e.preventDefault();
  ({ auth: authSubmit, checkout: checkoutSubmit, product: productSubmit })[f.dataset.f](f);
});
document.addEventListener('input', (e) => { if (e.target.id === 'q') { query = e.target.value; renderGrid(); } });
document.addEventListener('change', (e) => {
  if (e.target.dataset.c === 'status') {
    const o = S.orders.find(x => x.id === e.target.dataset.id);
    if (o) { setStatus(o, e.target.value); toast(`${o.id} is now ${o.status}`); }
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeModal(); closeCart(); } });
$('#drawer').addEventListener('click', (e) => { if (e.target.id === 'drawer') closeCart(); });
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
renderAll();
</script>
</body>
</html>
